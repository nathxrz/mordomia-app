<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>E-mail confirmado | Mordomia</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #fafafa;
        color: #1d1127;
        margin: 0;
        padding: 40px 0;
        text-align: center;
      }

      .container {
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        width: 90%;
        max-width: 480px;
        margin: 0 auto;
        padding: 40px 30px;
      }

      h1 {
        color: #7f13ec;
        font-size: 24px;
        margin-bottom: 16px;
      }

      p {
        font-size: 15px;
        line-height: 1.6;
        color: #333;
        margin-bottom: 20px;
      }

      a.button {
        display: inline-block;
        background-color: #7f13ec;
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        padding: 12px 24px;
        border-radius: 8px;
        transition: background-color 0.2s ease;
      }

      a.button:hover {
        background-color: #6510c0;
      }

      .footer {
        margin-top: 32px;
        font-size: 13px;
        color: #777;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>E-mail confirmado com sucesso!</h1>
      <p>Obrigada por se cadastrar no <strong>Mordomia</strong> 🐾</p>
      <p>
        Sua conta foi ativada com sucesso. Agora você já pode acessar a
        plataforma, agendar serviços ou oferecer cuidados para felinos.
      </p>
      <p class="footer">© Mordomia, 2025. Todos os direitos reservados.</p>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-mail confirmado | Mordomia</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #fafafa;
        color: #1d1127;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1.5rem;
      }

      .container {
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 460px;
        padding: 2.5rem 1.75rem;
        text-align: center;
      }

      h1 {
        color: #7f13ec;
        font-size: clamp(1.4rem, 4vw, 1.8rem);
        margin-bottom: 1rem;
      }

      p {
        font-size: clamp(0.9rem, 3vw, 1rem);
        line-height: 1.6;
        color: #333;
        margin-bottom: 1rem;
      }

      a.button {
        display: inline-block;
        background-color: #7f13ec;
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        transition: background-color 0.2s ease;
        font-size: 1rem;
      }

      a.button:hover {
        background-color: #6510c0;
      }

      .footer {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: #777;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #1a1a1a;
          color: #eaeaea;
        }

        .container {
          background-color: #2a2a2a;
        }

        p {
          color: #ccc;
        }

        a.button {
          background-color: #a85bff;
        }

        a.button:hover {
          background-color: #8a3be0;
        }

        .footer {
          color: #aaa;
        }
      }

      @media (max-width: 360px) {
        .container {
          padding: 2rem 1rem;
        }

        a.button {
          width: 100%;
          padding: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>E-mail confirmado com sucesso!</h1>
      <p>Obrigada por se cadastrar no <strong>Mordomia</strong> 🐾</p>
      <p>
        Sua conta foi ativada com sucesso. Agora você já pode acessar a
        plataforma, agendar serviços ou oferecer cuidados para felinos.
      </p>
      <p class="footer">© Mordomia, 2025. Todos os direitos reservados.</p>
    </div>
  </body>
</html>
